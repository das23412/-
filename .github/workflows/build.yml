name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI 内存有限：覆盖 gradle.properties 的 -Xmx8G，避免测试+构建并发时 OOM
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4G
    # 安全：签名 secrets 不放 job 级 env（否则 pub get/analyze/test 全程可读），
    # 只在注入签名的步骤内展开；是否配置过用非敏感的布尔输出传递。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 缓存 pub 与 Gradle 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: deps-${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: deps-${{ runner.os }}-

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 检测是否配置了正式签名
        id: sigcheck
        env:
          KEYSTORE_BASE64: ${{ secrets.MOYUE_KEYSTORE_BASE64 }}
        run: |
          # 该 secret 只注入到本步骤内，仅用于判空；真正的密钥展开在下一步
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验签名配置（未配置则拒绝构建，防止随机签名包）
        if: steps.sigcheck.outputs.configured != 'true'
        run: |
          echo "::error::未配置正式签名 Secrets（MOYUE_KEYSTORE_BASE64 / MOYUE_STORE_PASSWORD / MOYUE_KEY_ALIAS / MOYUE_KEY_PASSWORD）。"
          echo "::error::为避免产出随机签名、无法覆盖安装的 APK，已拒绝构建。请到仓库 Settings → Secrets and variables → Actions 添加，见 docs/发布检查清单.md。"
          exit 1

      - name: 注入正式签名（需配置仓库 Secrets）
        if: steps.sigcheck.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MOYUE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOYUE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOYUE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOYUE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/moyue-key.jks
          printf 'storeFile=moyue-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: 构建 APK
        run: flutter build apk --release

      - name: 构建失败诊断
        if: failure()
        run: |
          set +e
          flutter build apk --release > build_diag.log 2>&1
          {
            echo "===== 关键错误行 ====="
            grep -nE "error:|Error:|FAILURE:|Exception|What went wrong|Caused by|Unsupported|Could not|not found" build_diag.log | head -80
            echo ""
            echo "===== 失败区段 ====="
            awk '/FAILURE: Build failed/{f=1} f{print; n++} n>=40{exit}' build_diag.log | head -45
          } > diag.txt
          cat diag.txt
          MSG=$(grep -vE '^\s*$' diag.txt | tr '\n' '|' | tr -d '\r' | cut -c1-3800)
          echo "::error::构建诊断：$MSG"

      - name: 上传 APK（Actions 产物）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moyue-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 附加到 Release（推送 v* 标签时自动发布）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
