name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.MOYUE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.MOYUE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MOYUE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MOYUE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 注入正式签名（可选，需配置仓库 Secrets）
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/moyue-key.jks
          printf 'storeFile=moyue-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK（Actions 产物）
        uses: actions/upload-artifact@v4
        with:
          name: moyue-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 附加到 Release（打 tag 时触发）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
