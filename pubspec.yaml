name: moyue
description: "墨阅 — 纯本地、无联网的中文小说阅读器（TXT/EPUB/MOBI/AZW3/FB2/HTML）"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2
  # 本地数据库（书架 / 进度 / 书签）
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  # 设置存储
  shared_preferences: ^2.3.4
  # 文件/文件夹选择（走系统 SAF，不需要存储权限）
  # 注意：11.x 的安卓实现有编译问题（FilePickerPlugin 找不到符号），锁定稳定版 10.x
  file_picker: ^10.0.0
  # EPUB 解压与 XML 解析
  archive: ^3.6.1
  xml: ^6.5.0
  # GBK 编码支持（中文 TXT 常见）
  fast_gbk: ^1.0.0
  # “所有文件访问”权限引导
  permission_handler: ">=11.3.1 <13.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
